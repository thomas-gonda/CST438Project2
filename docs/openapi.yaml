# Starter OpenAPI contract for CST 438 Project 02.
# Copy to docs/openapi.yaml in your repo, then replace Workout/Exercise with YOUR resources.
# Render it:   https://editor.swagger.io  (File > Import file, or paste)
# Lint it:     npx @redocly/cli lint docs/openapi.yaml
# Mock it:     npx @stoplight/prism-cli mock docs/openapi.yaml   -> http://127.0.0.1:4010
openapi: 3.0.3

info:
  title: GameReview API
  version: 1.0.0
  description: |
    Allows users to review and rate games that the admin adds, Anybody who plays video games, It would mean users could review and rate games on the client application.
    Every error uses RFC 9457 Problem Details (see components/schemas/Problem).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Team 03
    url: https://github.com/thomas-gonda/CST438Project2

servers:
  - url: http://localhost:8080
    description: Local (docker compose up)
  - url: https://your-api.example.com
    description: Production (replace in Sprint 3)

# Every endpoint requires a Bearer token unless it overrides this with `security: []`.
security:
  - bearerAuth: []

tags:
  - name: Games
    description: Public game catalog and admin game management
  - name: Reviews
    description: Game reviews and ratings
  - name: Users
    description: Operations for the signed-in user

paths:
  /api/v1/games:
    get:
      tags: [Games]
      operationId: listGames
      summary: List all games
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of games
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Games]
      operationId: createGame
      summary: Add a new game
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCreate'
      responses:
        '201':
          description: Game created
          headers:
            Location:
              description: URL of the new game
              schema:
                type: string
                example: /api/v1/games/42
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/games/{gameId}:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      tags: [Games]
      operationId: getGame
      summary: Get one game
      security: []
      responses:
        '200':
          description: The game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Games]
      operationId: updateGame
      summary: Update a game
      description: Admin only. Send only the fields that should change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GamePatch'
      responses:
        '200':
          description: The updated game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Games]
      operationId: deleteGame
      summary: Delete a game
      description: Admin only.
      responses:
        '204':
          description: Deleted. No response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/games/{gameId}/reviews:
    parameters:
      - $ref: '#/components/parameters/GameId'
    get:
      tags: [Reviews]
      operationId: listReviewsForGame
      summary: List reviews for one game
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of reviews for the game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Reviews]
      operationId: createReviewForGame
      summary: Create a review for a game
      description: The authenticated user becomes the owner of the review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
      responses:
        '201':
          description: Review created
          headers:
            Location:
              description: URL of the new review
              schema:
                type: string
                example: /api/v1/reviews/84
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/reviews/{reviewId}:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    get:
      tags: [Reviews]
      operationId: getReview
      summary: Get one review
      security: []
      responses:
        '200':
          description: The review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Reviews]
      operationId: updateReview
      summary: Update one of my reviews
      description: Authenticated users may update reviews they own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewPatch'
      responses:
        '200':
          description: The updated review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Reviews]
      operationId: deleteReview
      summary: Delete one of my reviews
      description: Authenticated users may delete reviews they own.
      responses:
        '204':
          description: Deleted. No response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users:
    get:
      tags: [ Users ]
      operationId: listUsers
      summary: List all users
      description: Admin only.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/{userId}:
    get:
      tags: [ Users ]
      operationId: getUser
      summary: Get one user
      description: Admin only.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/me/reviews:
    get:
      tags: [Users, Reviews]
      operationId: listMyReviews
      summary: List my reviews
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of reviews created by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT established through Google OAuth2 Authorization Code with PKCE.

  parameters:
    GameId:
      name: gameId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 42
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 84
    Page:
      name: page
      in: query
      description: Zero-based page number
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    Game:
      type: object
      required: [id, name, publisher, category, price]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 42
        name:
          type: string
          example: 'The Legend of Zelda: Breath of the Wild'
        publisher:
          type: string
          example: Nintendo
        category:
          type: string
          example: Action-adventure
        price:
          type: number
          format: double
          example: 59.99

    GameCreate:
      type: object
      required: [name, publisher, category, price]
      properties:
        name:
          type: string
          example: 'The Legend of Zelda: Breath of the Wild'
        publisher:
          type: string
          example: Nintendo
        category:
          type: string
          example: Action-adventure
        price:
          type: number
          format: double
          example: 59.99

    GamePatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        publisher:
          type: string
        category:
          type: string
        price:
          type: number
          format: double

    Review:
      type: object
      required: [id, comment, rating, reviewDate, userId, gameId]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 84
        comment:
          type: string
          example: Great exploration and world design.
        rating:
          type: number
          format: float
          example: 4.5
        reviewDate:
          type: string
          format: date
          readOnly: true
          example: '2026-10-06'
        userId:
          type: integer
          format: int64
          readOnly: true
          example: 7
        gameId:
          type: integer
          format: int64
          readOnly: true
          example: 42

    ReviewCreate:
      description: userId comes from the authenticated user, gameId comes from the path, and reviewDate is assigned by the server.
      type: object
      required: [comment, rating]
      properties:
        comment:
          type: string
          example: Great exploration and world design.
        rating:
          type: number
          format: float
          example: 4.5

    ReviewPatch:
      type: object
      minProperties: 1
      properties:
        comment:
          type: string
        rating:
          type: number
          format: float

    User:
      type: object
      required: [id, email, displayName, role]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 7
        email:
          type: string
          format: email
          example: sam@csumb.edu
        displayName:
          type: string
          example: Sam Otter
        role:
          $ref: '#/components/schemas/Role'

    Role:
      type: string
      enum: [USER, ADMIN]

    UserPage:
      type: object
      required: [ content, page ]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/PageMeta'

    PageMeta:
      description: Spring Data PagedModel metadata.
      type: object
      required: [size, number, totalElements, totalPages]
      properties:
        size:
          type: integer
          example: 20
        number:
          type: integer
          example: 0
        totalElements:
          type: integer
          format: int64
          example: 57
        totalPages:
          type: integer
          example: 3

    GamePage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Game'
        page:
          $ref: '#/components/schemas/PageMeta'

    ReviewPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        page:
          $ref: '#/components/schemas/PageMeta'

    Problem:
      description: RFC 9457 Problem Details. The common error body returned by the API.
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: Game 42 not found
        instance:
          type: string
          example: /api/v1/games/42

  responses:
    BadRequest:
      description: Validation failed or malformed JSON
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Bad Request
            status: 400
            detail: One or more fields failed validation. Check the request against the contract.
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unauthorized
            status: 401
    Forbidden:
      description: Valid token, but the caller is not allowed to perform this operation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Forbidden
            status: 403
    NotFound:
      description: The requested resource does not exist or is not visible to the caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not Found
            status: 404
            detail: Resource not found
    InternalError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Internal Server Error
            status: 500
