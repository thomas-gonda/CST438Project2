spring.application.name=demo
spring.datasource.url=${SUPABASE_DB_URL:jdbc:h2:mem:cst438;DB_CLOSE_DELAY=-1}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Local basic-auth users until the project's OAuth provider is connected.
app.auth.admin-username=${APP_ADMIN_USERNAME:admin}
app.auth.admin-password=${APP_ADMIN_PASSWORD:admin-password}
app.auth.user-username=${APP_USER_USERNAME:user}
app.auth.user-password=${APP_USER_PASSWORD:user-password}
