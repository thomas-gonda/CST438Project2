spring.application.name=demo
spring.datasource.url=${SUPABASE_DB_URL:jdbc:h2:mem:cst438;DB_CLOSE_DELAY=-1}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Local basic-auth users remain available for local development and tests.
app.auth.basic-enabled=${BASIC_AUTH_ENABLED:true}
app.auth.admin-username=${APP_ADMIN_USERNAME:admin}
app.auth.admin-password=${APP_ADMIN_PASSWORD:admin-password}
app.auth.user-username=${APP_USER_USERNAME:user}
app.auth.user-password=${APP_USER_PASSWORD:user-password}

# OAuth 2.0 resource-server configuration. Enable this in deployed environments
# and provide either an issuer URI, a JWK set URI, or a JWT signing secret.
app.oauth2.enabled=${OAUTH2_ENABLED:false}
app.oauth2.issuer-uri=${OAUTH2_ISSUER_URI:}
app.oauth2.jwk-set-uri=${OAUTH2_JWK_SET_URI:}
app.oauth2.hmac-secret=${OAUTH2_JWT_SECRET:}
app.oauth2.admin-scope=${OAUTH2_ADMIN_SCOPE:admin}
