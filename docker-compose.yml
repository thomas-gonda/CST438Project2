services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cst438}
      POSTGRES_USER: ${POSTGRES_USER:-cst438}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cst438-local}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cst438} -d ${POSTGRES_DB:-cst438}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: gamereview-api:compose
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SUPABASE_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-cst438}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cst438}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cst438-local}
      SPRING_SQL_INIT_MODE: always

volumes:
  pgdata:
